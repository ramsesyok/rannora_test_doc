version: 2

project_name: runnora-docgen

# Windows の実行ファイルに製品名・バージョンなどのリソースを埋め込む (生成した rsrc_windows_*.syso を go build が自動でリンクする)。
# 署名のない Go の実行ファイルは、シンボルを削り (-s -w) 製品情報もないと Windows Defender の
# 機械学習判定 (Trojan:Win32/Wacatac.B!ml など) で誤検出されやすいため、シンボルを残し製品情報を付ける。
before:
  hooks:
    - go run scripts/licenses.go
    - go run github.com/tc-hib/go-winres@v0.3.3 simply --arch amd64,arm64 --manifest cli --product-name runnora-docgen --file-description "runnora-docgen - runbook documentation generator" --original-filename runnora-docgen.exe --product-version {{ .Version }} --file-version {{ .Version }}

builds:
  - id: runnora-docgen
    main: .
    binary: runnora-docgen
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -X github.com/ramsesyok/runnora-docgen/cmd.Version=v{{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  groups:
    - title: Dependencies
      regexp: '^.*Bump .*$'
      order: 1
    - title: Changes
      order: 0

release:
  header: |
    ## インストール

    下記のアーカイブから OS / アーキテクチャに合ったもの（Windows は `runnora-docgen_{{ .Tag }}_windows_amd64.zip`）をダウンロードし、
    展開した `runnora-docgen` を PATH の通った場所に置いてください。

    ```sh
    go install github.com/ramsesyok/runnora-docgen@{{ .Tag }}
    ```
