desc: ORD-003 二重キャンセルで在庫を二重加算しない
runners:
  req:
    endpoint: http://127.0.0.1:18081
steps:
  reset:
    desc: サンプル専用APIで在庫5・注文0件に初期化する
    req:
      /test/reset:
        post:
          body:
            application/json: {}
    test: |
      current.res.status == 200 &&
      current.res.body.available == 5 &&
      current.res.body.orderCount == 0
  stock_before:
    desc: 初期在庫が5個であることを確認する
    req:
      /inventory/PEN-001:
        get:
          body: null
    test: |
      current.res.status == 200 &&
      current.res.body.sku == "PEN-001" &&
      current.res.body.available == 5
  create_order:
    desc: 商品を2個注文し、確定状態を確認する
    req:
      /orders:
        post:
          body:
            application/json:
              sku: PEN-001
              quantity: 2
    test: |
      current.res.status == 201 &&
      current.res.body.id != "" &&
      current.res.body.sku == "PEN-001" &&
      current.res.body.quantity == 2 &&
      current.res.body.status == "confirmed"
  save_order_id:
    desc: create_orderの応答body.idをorder_idに保存し、2回とも同じ注文を取り消す
    bind:
      order_id: steps.create_order.res.body.id
  cancel_first:
    desc: 1回目のキャンセルが成功することを確認する
    req:
      /orders/{{ order_id }}/cancel:
        post:
          body:
            application/json: {}
    test: |
      current.res.status == 200 &&
      current.res.body.id == order_id &&
      current.res.body.sku == "PEN-001" &&
      current.res.body.quantity == 2 &&
      current.res.body.status == "cancelled"
  cancel_again:
    desc: 同じ注文を再キャンセルし、取消済みエラーを確認する
    req:
      /orders/{{ order_id }}/cancel:
        post:
          body:
            application/json: {}
    test: |
      current.res.status == 409 &&
      current.res.body.code == "ORDER_ALREADY_CANCELLED"
  get_cancelled:
    desc: エラー後も注文が取消状態のままであることを確認する
    req:
      /orders/{{ order_id }}:
        get:
          body: null
    test: |
      current.res.status == 200 &&
      current.res.body.id == order_id &&
      current.res.body.sku == "PEN-001" &&
      current.res.body.quantity == 2 &&
      current.res.body.status == "cancelled"
  stock_not_doubled:
    desc: 在庫が5個に戻り、二重加算された7個になっていないことを確認する
    req:
      /inventory/PEN-001:
        get:
          body: null
    test: |
      current.res.status == 200 &&
      current.res.body.available == steps.stock_before.res.body.available
