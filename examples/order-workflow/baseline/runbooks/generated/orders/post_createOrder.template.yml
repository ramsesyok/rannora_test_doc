desc: 注文を作成し、数量分の在庫を引き当てる template
labels:
  - generated
  - openapi
  - orders
  - method:post
  - operation:createOrder
  - mode:template

runners:
  req:
    endpoint: ${RUNNORA_BASE_URL}

vars:
  case: {}

steps:
  call_api:
    req:
      /orders:
        post:
          headers: "{{ vars.case.headers }}"
          body:
            application/json: "{{ vars.case.requestBody }}"
    test: |
      current.res.status == vars.case.expect.status
